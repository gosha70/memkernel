[tool.poetry]
name = "memkernel"
version = "0.2.0"
description = "Code-aware memory server for AI coding copilots"
authors = ["EGOGE"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/gosha70/memkernel"
homepage = "https://memkernel.dev"
documentation = "https://memkernel.dev"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
packages = [{include = "memkernel", from = "src"}]

[tool.poetry.scripts]
memkernel = "memkernel.mcp.server:main"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
mcp = ">=1.25,<2"
chromadb = ">=1.0,<2"
sentence-transformers = ">=4.0,<6"
rank-bm25 = ">=0.2"
tree-sitter = ">=0.22,<1"
tree-sitter-python = ">=0.23"
pydantic = ">=2.0,<3"
pydantic-settings = ">=2.0,<3"
fastapi = ">=0.115,<1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.24"
pytest-cov = ">=5"
ruff = ">=0.9"
mypy = ">=1.13"
httpx = ">=0.27"
pip-audit = "^2.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
markers = [
    "unit: Component tests with mocked dependencies",
    "integration: Tests with real external services",
    "e2e: End-to-end MCP round-trip tests",
    "slow: Tests that are slow (model loading, etc.)",
]
asyncio_mode = "auto"

[tool.coverage.report]
omit = ["src/memkernel/core/ports.py"]
