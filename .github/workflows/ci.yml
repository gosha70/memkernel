name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - name: Free runner disk space
        # torch pulls ~6 GB of CUDA wheels; the default runner image leaves
        # too little room for download + install. Drop toolchains we never use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
      - run: poetry install --no-interaction
      - name: Ruff check
        run: poetry run ruff check src/ tests/
      - name: Ruff format check
        run: poetry run ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - name: Free runner disk space
        # torch pulls ~6 GB of CUDA wheels; the default runner image leaves
        # too little room for download + install. Drop toolchains we never use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
      - run: poetry install --no-interaction
      - name: Mypy
        run: poetry run mypy src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - name: Free runner disk space
        # torch pulls ~6 GB of CUDA wheels; the default runner image leaves
        # too little room for download + install. Drop toolchains we never use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
      - run: poetry install --no-interaction
      - name: Run tests with coverage
        run: |
          poetry run pytest \
            -m "not slow" \
            --tb=short \
            --cov=memkernel \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            -q
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - name: Free runner disk space
        # torch pulls ~6 GB of CUDA wheels; the default runner image leaves
        # too little room for download + install. Drop toolchains we never use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
      - run: poetry install --no-interaction
      - name: pip-audit vulnerability scan
        # chromadb 1.5.9 (latest release as of 2026-10-11) carries four advisories with no
        # fixed version published; ignored until chromadb ships a fix. Re-check on every bump.
        run: |
          poetry run pip-audit --skip-editable \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - name: Free runner disk space
        # torch pulls ~6 GB of CUDA wheels; the default runner image leaves
        # too little room for download + install. Drop toolchains we never use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
      - run: poetry install --no-interaction
      - name: Verify package imports
        run: |
          poetry run python - <<'EOF'
          from memkernel.core.services import MemoryService
          from memkernel.mcp.server import create_server
          from memkernel.storage.chroma import ChromaVectorStore
          from memkernel.retrieval.search import HybridSearchService
          print("All imports OK")
          EOF
